services:
  ai-knowledge-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-knowledge-assistant:latest
    ports:
      - "8001:8000"
    environment:
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-local}
      DIFY_API_BASE_URL: ${DIFY_API_BASE_URL:-https://api.dify.ai/v1}
      DIFY_API_KEY: ${DIFY_API_KEY:-}
      DIFY_USER: ${DIFY_USER:-ai-learning-assistant}
      DIFY_TIMEOUT_SECONDS: ${DIFY_TIMEOUT_SECONDS:-60}
      DIFY_VERIFY_SSL: ${DIFY_VERIFY_SSL:-true}
      ENABLE_HYBRID_RETRIEVAL: ${ENABLE_HYBRID_RETRIEVAL:-true}
      ENABLE_RERANKER: ${ENABLE_RERANKER:-true}
      RERANKER_MODEL_ID: ${RERANKER_MODEL_ID:-BAAI/bge-reranker-base}
      RAG_GATE_LOW: ${RAG_GATE_LOW:-0.48}
      RAG_GATE_HIGH: ${RAG_GATE_HIGH:-0.83}
      ENABLE_POST_GENERATION_VERIFICATION: ${ENABLE_POST_GENERATION_VERIFICATION:-true}
      MAX_UNSUPPORTED_CLAIM_RATIO: ${MAX_UNSUPPORTED_CLAIM_RATIO:-0.15}
      HF_HOME: /app/.cache/huggingface
    volumes:
      - huggingface-cache:/app/.cache/huggingface
      - ./rag_project/source_documents:/app/rag_project/source_documents
      - ./rag_project/knowledge_base:/app/rag_project/knowledge_base
    restart: unless-stopped

volumes:
  huggingface-cache:
